{% set version = "3.7.25" %}
{% set chopperlib_version = "v4.1.0" %}

package:
  name: mcstas-suite
  version: {{ version }}

# sha256 value manually found by 
# curl -sL url | openssl sha256
source:
  - url: https://github.com/mccode-dev/McCode/archive/v{{ version }}.tar.gz
    sha256: b90618513f20459316e44e8392dede96b3037d1665f272bd8394cc0d8600124c
    folder: src
  # Contributed mcstas-chopper-lib (Greg Tucker), pinned by tag rather than
  # url+sha256: the repo has no stable release tarball checksum workflow yet,
  # and pinning the git rev keeps a version bump to a one-line edit above
  # instead of also requiring a sha256 recompute. Populated here (rather than
  # left to McCode's own live FetchContent, see cmake/Modules/ChopperLib.cmake
  # upstream) so the conda-forge build is reproducible/offline and its
  # provenance is auditable from this recipe. Deliberately NOT shallow (no
  # git_depth): conda-build's git source fetcher does `git clone --mirror
  # --depth N` for the *cache* clone, which only pulls the shallow history of
  # the default branch (chopper-lib's is `main`) -- v4.0.0 isn't its tip, so a
  # depth-limited mirror never contains the tag, and the later `git checkout
  # v4.0.0` fails with "pathspec 'v4.0.0' did not match any file(s) known to
  # git". The repo is tiny, so a full mirror clone costs nothing.
  - git_url: https://github.com/mcdotstar/mcstas-chopper-lib.git
    git_rev: {{ chopperlib_version }}
    folder: chopperlib

build:
  number: 0

outputs:

  - name: mcstas-core
    script: "{{ 'install-files-core.bat' if win else 'install-files-core.sh' }}"
    requirements:
      build:
        - cmake
        - make  # [unix]
        - {{ compiler('c') }}
        - {{ stdlib("c") }}
        - flex  # [unix]
        - bison  # [unix]
        - winflexbison  # [win]
      host:
        - dirent  # [win]
      run:
        - python
        - c-compiler
        - {{ stdlib("c") }}
        - bash  # [unix]
        # for mcrun
        - pyaml
        - numpy
        - mslex  # [win]
        # for mctest
        - psutil
    test:
      files:
        - test_pkg.py
      commands:
        - python test_pkg.py core
      source_files:
        - src/mcstas-comps/examples/BNL/BNL_H8/BNL_H8.instr
        - src/mcstas-comps/examples/Union_demos/Manual_example/Manual_example.instr

  - name: mcstas-data
    build:
      noarch: generic
    script: "{{ 'install-files-data.bat' if win else 'install-files-data.sh' }}"
    test:
      files:
        - test_pkg.py
      requires:
        - python
      commands:
        - python test_pkg.py data

  - name: mcstas-mcgui
    requirements:
      run:
        - mcstas-core
        - qtpy
        - qscintilla2
    test:
      files:
        - test_pkg.py
      commands:
        - python test_pkg.py mcgui

  - name: mcstas-vis
    requirements:
      run:
        - mcstas-core
        #  Note: conda-forge linter wants matplotlib-base and not matplotlib. It
        #  actually makes no difference (as per October 2023) since we anyway
        #  install tornado+pyqt.
        - matplotlib-base
        - numpy
        - tornado >=5
        - scipy
        - pillow
        - pyqtgraph
        - qtpy
        - nodejs
        # for traces from mcdisplay
        - ply
        # for sync of 3D / js files
        - rsync  # [unix]
        # for visualisation of test output
        - jinja2
        # PW 2026/05/05 - suppress cadquery because of solver issues
        # for creating CAD output from mcdisplay
        # - cadquery  # [not ppc64le]
        # McStasscript and jupyter support
        - mcstasscript >=0.0.89
        - jupytext
        - jupyterlab
        - m2-which  # [win]
        - m2-sed  # [win]
        - m2-grep  # [win]
        - m2-gzip  # [win]
        - m2-coreutils  # [win]

    test:
      files:
        - test_pkg.py
      commands:
        - python test_pkg.py vis

  - name: mcstas
    test:
      files:
        - test_pkg.py
      requires:
      commands:
        - python test_pkg.py mcstas
    requirements:
      run:
        - {{ pin_subpackage('mcstas-core', max_pin="x.x.x") }}
        - {{ pin_subpackage('mcstas-data', max_pin="x.x.x") }}
        - {{ pin_subpackage('mcstas-mcgui', max_pin="x.x.x") }}
        - {{ pin_subpackage('mcstas-vis', max_pin="x.x.x") }}
        - msmpi  # [win]
        - openmpi =4  # [unix]
        - ucx  # [linux]
        - gsl
        - libnexus
        - nexpy
        - cif2hkl
        - mcpl >=2.2.0  # [not ppc64le]
        - mcpl-core >=2.2.0  # [not ppc64le]
        - mcpl-extra >=2.2.0  # [not ppc64le]
        - kdsource  # [not ppc64le]
        - ncrystal >=4.2.0  # [not ppc64le]
        - ncrystal-extra  # [not ppc64le]

about:
  home: https://mcstas.org/
  summary: McStas is a general tool for simulating neutron scattering instruments and experiments.
  description: |
    McStas is a general tool for simulating neutron scattering instruments and
    experiments.
  license: GPL-3.0-only
  license_family: GPL3
  license_file: src/COPYING
  doc_url: https://mcstas.org/
  dev_url: https://github.com/mccode-dev/McCode

extra:
  recipe-maintainers:
    - willend
    - tkittel
